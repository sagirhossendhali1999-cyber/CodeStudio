name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Fix Corrupted Gradle Wrapper & Clean Legacy Files
        run: |
          cp -f app/src/main/assets/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          rm -f app/src/main/kotlin/com/shd/codestudio/AppDialogs.kt \
                app/src/main/kotlin/com/shd/codestudio/CodePage.kt \
                app/src/main/kotlin/com/shd/codestudio/CreateProjectDialog.kt \
                app/src/main/kotlin/com/shd/codestudio/DocFilesPage.kt \
                app/src/main/kotlin/com/shd/codestudio/EditorScreen.kt \
                app/src/main/kotlin/com/shd/codestudio/FileUtils.kt \
                app/src/main/kotlin/com/shd/codestudio/HomeScreen.kt \
                app/src/main/kotlin/com/shd/codestudio/LivePreviewPage.kt \
                app/src/main/kotlin/com/shd/codestudio/PRootManager.kt \
                app/src/main/kotlin/com/shd/codestudio/ProjectCard.kt \
                app/src/main/kotlin/com/shd/codestudio/ProjectData.kt \
                app/src/main/kotlin/com/shd/codestudio/TerminalScreen.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Bundled Offline Engine (Kotlin+Compose+Plugins & Android 36 SDK)
        id: engine-cache
        uses: actions/cache@v5
        with:
          path: app/src/main/assets/engine-bundle
          key: codestudio-engine-bundle-v1-k2.4.21-api36

      - name: Build Offline Engine Bundle (Zero-Setup Auto-Pilot Assets)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          KOTLIN_VERSION: '2.4.21'
          MIN_API: '30'
        run: |
          DEST_DIR="$PWD/app/src/main/assets/engine-bundle"
          mkdir -p "$DEST_DIR" /tmp/sdk36

          # ১. Android 16 (API 36) android.jar সরাসরি Google Repo থেকে বান্ডেল করা
          echo "Downloading Android 16 (API 36) android.jar..."
          curl -fsSL https://dl.google.com/android/repository/platform-36_r01.zip -o /tmp/platform-36.zip
          unzip -j -o /tmp/platform-36.zip '*/android.jar' -d /tmp/sdk36 || unzip -j -o /tmp/platform-36.zip 'android.jar' -d /tmp/sdk36
          cp -f /tmp/sdk36/android.jar "$DEST_DIR/android-36.jar"

          # ২. Kotlin 2.4.21 + Compose + Serialization + Parcelize ডাউনলোড
          mkdir -p /tmp/kotlinc-build/jars
          cat <<EOF > /tmp/kotlinc-build/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.shd.codestudio</groupId>
            <artifactId>kotlinc-pack-fetcher</artifactId>
            <version>1.0.0</version>
            <dependencies>
              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-compiler-embeddable</artifactId>
                <version>${KOTLIN_VERSION}</version>
              </dependency>
              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-compose-compiler-plugin-embeddable</artifactId>
                <version>${KOTLIN_VERSION}</version>
              </dependency>
              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-serialization-compiler-plugin-embeddable</artifactId>
                <version>${KOTLIN_VERSION}</version>
              </dependency>
              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-parcelize-compiler</artifactId>
                <version>${KOTLIN_VERSION}</version>
              </dependency>
              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-parcelize-runtime</artifactId>
                <version>${KOTLIN_VERSION}</version>
              </dependency>
            </dependencies>
          </project>
          EOF

          mvn -B -f /tmp/kotlinc-build/pom.xml dependency:copy-dependencies \
            -DoutputDirectory=/tmp/kotlinc-build/jars \
            -DincludeScope=runtime

          python3 - <<'PY'
          import os, glob, zipfile, json, re

          jars_dir = "/tmp/kotlinc-build/jars"
          work_dir = "/tmp/kotlinc-build/work"
          pack_dir = "/tmp/kotlinc-build/pack"
          os.makedirs(work_dir, exist_ok=True)
          os.makedirs(os.path.join(pack_dir, "dex"), exist_ok=True)
          os.makedirs(os.path.join(pack_dir, "plugins"), exist_ok=True)
          os.makedirs(os.path.join(pack_dir, "stdlib"), exist_ok=True)

          all_jars = sorted(glob.glob(os.path.join(jars_dir, "*.jar")))
          compose_jars = [j for j in all_jars if "kotlin-compose-compiler-plugin" in os.path.basename(j)]
          ser_jars = [j for j in all_jars if "kotlin-serialization-compiler-plugin" in os.path.basename(j)]
          par_jars = [j for j in all_jars if "kotlin-parcelize-compiler" in os.path.basename(j)]
          par_rt_jars = [j for j in all_jars if "kotlin-parcelize-runtime" in os.path.basename(j)]
          excluded = set(compose_jars + ser_jars + par_jars + par_rt_jars)
          core_jars = [j for j in all_jars if j not in excluded]

          stdlib_jars = [j for j in all_jars if re.match(r"^kotlin-stdlib-\d", os.path.basename(j))]
          if not stdlib_jars:
              stdlib_jars = [j for j in all_jars if os.path.basename(j).startswith("kotlin-stdlib-")]

          if stdlib_jars:
              with open(stdlib_jars[0], "rb") as src, open(os.path.join(pack_dir, "stdlib", "kotlin-stdlib.jar"), "wb") as dst:
                  dst.write(src.read())
          if par_rt_jars:
              with open(par_rt_jars[0], "rb") as src, open(os.path.join(pack_dir, "stdlib", "kotlin-parcelize-runtime.jar"), "wb") as dst:
                  dst.write(src.read())

          def is_ignored_entry(name: str) -> bool:
              if name.endswith("/"):
                  return True
              if name == "module-info.class" or name.endswith("/module-info.class"):
                  return True
              if name.startswith("META-INF/versions/") or name == "META-INF/MANIFEST.MF":
                  return True
              upper = name.upper()
              if upper.startswith("META-INF/") and (upper.endswith(".SF") or upper.endswith(".DSA") or upper.endswith(".RSA")):
                  return True
              return False

          def pack_classes_and_resources(jar_list, out_classes_jar, out_res_zip):
              seen_classes = set()
              seen_res = set()
              services = {}
              with zipfile.ZipFile(out_classes_jar, "w", compression=zipfile.ZIP_STORED) as z_cls, \
                   zipfile.ZipFile(out_res_zip, "w", compression=zipfile.ZIP_DEFLATED) as z_res:
                  for jar_path in jar_list:
                      with zipfile.ZipFile(jar_path, "r") as zin:
                          for info in zin.infolist():
                              name = info.filename.replace("\\", "/")
                              if is_ignored_entry(name):
                                  continue
                              data = zin.read(info.filename)
                              if name.endswith(".class"):
                                  if name not in seen_classes:
                                      seen_classes.add(name)
                                      z_cls.writestr(name, data)
                              elif name.startswith("META-INF/services/") and len(name) > len("META-INF/services/"):
                                  lines = [l.strip() for l in data.decode("utf-8", errors="ignore").splitlines() if l.strip()]
                                  services.setdefault(name, [])
                                  for l in lines:
                                      if l not in services[name]:
                                          services[name].append(l)
                              else:
                                  if name not in seen_res:
                                      seen_res.add(name)
                                      z_res.writestr(name, data)
                  for svc_name, lines in services.items():
                      z_res.writestr(svc_name, ("\n".join(lines) + "\n").encode("utf-8"))

          pack_classes_and_resources(core_jars, os.path.join(work_dir, "kotlinc_core_classes.jar"), os.path.join(pack_dir, "dex", "kotlinc_resources.zip"))
          pack_classes_and_resources(compose_jars, os.path.join(work_dir, "compose_plugin_classes.jar"), os.path.join(pack_dir, "plugins", "compose-compiler.jar"))
          pack_classes_and_resources(ser_jars, os.path.join(work_dir, "serialization_plugin_classes.jar"), os.path.join(pack_dir, "plugins", "serialization-compiler.jar"))
          pack_classes_and_resources(par_jars, os.path.join(work_dir, "parcelize_plugin_classes.jar"), os.path.join(pack_dir, "plugins", "parcelize-compiler.jar"))

          manifest = {
              "kotlinVersion": os.environ["KOTLIN_VERSION"],
              "format": "codestudio-kotlinc-pack-v3",
              "composeIncluded": len(compose_jars) > 0,
              "serializationIncluded": len(ser_jars) > 0,
              "parcelizeIncluded": len(par_jars) > 0
          }
          with open(os.path.join(pack_dir, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
          D8_JAR="$BUILD_TOOLS_DIR/lib/d8.jar"
          ANDROID_LIB="$DEST_DIR/android-36.jar"

          java -Xmx5g -cp "$D8_JAR" com.android.tools.r8.D8 \
            --release --min-api "$MIN_API" --lib "$ANDROID_LIB" \
            --output /tmp/kotlinc-build/pack/dex/kotlinc_core.zip \
            /tmp/kotlinc-build/work/kotlinc_core_classes.jar

          java -Xmx5g -cp "$D8_JAR" com.android.tools.r8.D8 \
            --release --min-api "$MIN_API" --lib "$ANDROID_LIB" \
            --classpath /tmp/kotlinc-build/work/kotlinc_core_classes.jar \
            --output /tmp/kotlinc-build/pack/dex/kotlinc_compose.zip \
            /tmp/kotlinc-build/work/compose_plugin_classes.jar

          java -Xmx5g -cp "$D8_JAR" com.android.tools.r8.D8 \
            --release --min-api "$MIN_API" --lib "$ANDROID_LIB" \
            --classpath /tmp/kotlinc-build/work/kotlinc_core_classes.jar \
            --output /tmp/kotlinc-build/pack/dex/kotlinc_serialization.zip \
            /tmp/kotlinc-build/work/serialization_plugin_classes.jar

          java -Xmx5g -cp "$D8_JAR" com.android.tools.r8.D8 \
            --release --min-api "$MIN_API" --lib "$ANDROID_LIB" \
            --classpath /tmp/kotlinc-build/work/kotlinc_core_classes.jar \
            --output /tmp/kotlinc-build/pack/dex/kotlinc_parcelize.zip \
            /tmp/kotlinc-build/work/parcelize_plugin_classes.jar || true

          rm -f "$DEST_DIR/kotlinc-compose-pack.zip"
          cd /tmp/kotlinc-build/pack
          zip -r -6 "$DEST_DIR/kotlinc-compose-pack.zip" .
          ls -lh "$DEST_DIR/"

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          validate-wrappers: false

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: CodeStudio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn